name: Release

# Roda quando uma tag vX.Y.Z é enviada. Só cria um rascunho: publicar o release é decisão de quem mantém.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build (Linux x86_64)
    # 22.04: o binário depende da glibc do sistema que o compilou, então o mais antigo suportado.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # atestado de procedência (assinado pelo GitHub)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: A tag bate com a versão e vem da main
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão do Cargo.toml (v${version})." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "A tag ${GITHUB_REF_NAME} aponta para um commit que não está na main." >&2
            exit 1
          fi
      - name: Dependências do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Testes
        run: cargo test --locked --workspace
      - name: Build de release
        run: cargo build --release --locked -p skyship -p skyship-gui
      - name: Empacotar
        run: |
          name="skyship-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir -p "dist/${name}"
          cp target/release/skyship target/release/skyship-gui "dist/${name}/"
          cp LICENSE-MIT LICENSE-APACHE README.md README.pt-BR.md TERMS.md TERMS.pt-BR.md "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Atestar a procedência
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  draft:
    name: Rascunho do release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # só aqui: criar o rascunho
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Criar o rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft --verify-tag \
            --title "skyship ${TAG}" \
            --notes "Rascunho gerado automaticamente. Revise o texto e publique."
