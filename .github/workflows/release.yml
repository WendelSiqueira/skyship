name: Release

# - Tag vX.Y.Z enviada: constrói os pacotes, atesta a procedência e cria um release em RASCUNHO
#   (publicar é uma decisão de quem mantém).
# - Pull request que mexe neste arquivo ou na configuração do pacote, ou disparo manual: ENSAIO. Constrói
#   os mesmos pacotes e os deixa como arquivos do workflow (7 dias), sem tag, sem atestado e sem release.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - crates/gui/tauri.conf.json
      - crates/gui/icons/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # tauri-cli: binário oficial, versão e hash fixados (conferidos antes de executar)
  TAURI_CLI_VERSION: "2.12.6"
  TAURI_CLI_SHA256_LINUX: 057983293b14d88b29331f96b2e57ce9780f887e7a0b76e255844924f83118dc
  TAURI_CLI_SHA256_WINDOWS: 39636fa68bc00f13dd610fb57688f292e93742978cc35395f2f1be7c540b88a1

jobs:
  check:
    name: Versão e origem
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      dry: ${{ steps.v.outputs.dry }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        name: Conferir as versões e a tag
        run: |
          version="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          tauri_version="$(python3 -c "import json; print(json.load(open('crates/gui/tauri.conf.json'))['version'])")"
          if [ "${version}" != "${tauri_version}" ]; then
            echo "A versão do Cargo.toml (${version}) não bate com a de crates/gui/tauri.conf.json (${tauri_version})." >&2
            exit 1
          fi
          dry=true
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            dry=false
            if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
              echo "A tag ${GITHUB_REF_NAME} não bate com a versão do Cargo.toml (v${version})." >&2
              exit 1
            fi
            git fetch --no-tags origin main
            if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
              echo "A tag ${GITHUB_REF_NAME} aponta para um commit que não está na main." >&2
              exit 1
            fi
          fi
          prerelease=false
          case "${version}" in 0.*) prerelease=true ;; esac
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${prerelease}" >> "$GITHUB_OUTPUT"
          echo "dry=${dry}" >> "$GITHUB_OUTPUT"

  audit:
    name: Auditoria de dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit
      # Falha com vulnerabilidades; os avisos informativos do Tauri/GTK não (veja docs/security.md).
      - run: cargo audit

  linux:
    name: Linux (AppImage e .deb)
    needs: [check, audit]
    # 22.04: o binário depende da glibc do sistema que o compilou, então o mais antigo suportado.
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write # atestado de procedência (só nas tags)
      attestations: write
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependências do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf file
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Testes
        run: cargo test --locked --workspace
      - name: tauri-cli (versão e hash fixados)
        run: |
          curl -fsSL -o cargo-tauri.tgz \
            "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v${TAURI_CLI_VERSION}/cargo-tauri-x86_64-unknown-linux-gnu.tgz"
          echo "${TAURI_CLI_SHA256_LINUX}  cargo-tauri.tgz" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/tauri-cli"
          tar -xzf cargo-tauri.tgz -C "${RUNNER_TEMP}/tauri-cli" cargo-tauri
          echo "${RUNNER_TEMP}/tauri-cli" >> "$GITHUB_PATH"
      - name: Gerar AppImage e .deb
        working-directory: crates/gui
        run: cargo tauri build --bundles appimage,deb
      - name: Reunir os pacotes
        run: |
          mkdir dist
          cp target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb dist/
          ls -l dist
      - name: Atestar a procedência
        if: needs.check.outputs.dry == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-packages
          path: dist/*
          retention-days: ${{ needs.check.outputs.dry == 'true' && 7 || 90 }}
          if-no-files-found: error

  windows:
    name: Windows (instalador e zip para terminal)
    needs: [check, audit]
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # atestado de procedência (só nas tags)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Testes
        run: cargo test --locked --workspace
      - name: tauri-cli (versão e hash fixados)
        shell: pwsh
        run: |
          $url = "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$($env:TAURI_CLI_VERSION)/cargo-tauri-x86_64-pc-windows-msvc.zip"
          Invoke-WebRequest -Uri $url -OutFile cargo-tauri.zip
          $hash = (Get-FileHash cargo-tauri.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:TAURI_CLI_SHA256_WINDOWS) { throw "hash do tauri-cli diferente do esperado: $hash" }
          $dir = Join-Path $env:RUNNER_TEMP "tauri-cli"
          Expand-Archive cargo-tauri.zip -DestinationPath $dir
          Add-Content -Path $env:GITHUB_PATH -Value $dir
      - name: Gerar o instalador (NSIS)
        working-directory: crates/gui
        run: cargo tauri build --bundles nsis
      - name: CLI para o zip
        run: cargo build --release --locked -p skyship
      - name: Reunir os pacotes
        shell: pwsh
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          New-Item -ItemType Directory -Path dist, stage | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe dist/
          $name = "skyship-v$($env:VERSION)-windows-x86_64-portable"
          New-Item -ItemType Directory -Path "stage/$name" | Out-Null
          Copy-Item target/release/skyship.exe, target/release/skyship-gui.exe, LICENSE-MIT, LICENSE-APACHE, README.md, README.pt-BR.md "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"
          Get-ChildItem dist | Format-Table Name, Length
      - name: Atestar a procedência
        if: needs.check.outputs.dry == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-packages
          path: dist/*
          retention-days: ${{ needs.check.outputs.dry == 'true' && 7 || 90 }}
          if-no-files-found: error

  draft:
    name: Rascunho do release
    if: needs.check.outputs.dry == 'false'
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write # só aqui: criar o rascunho
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*-packages"
          merge-multiple: true
          path: dist
      - name: Somas de verificação
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Texto do release
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          cat > notes.md <<EOF
          Rascunho gerado automaticamente. **Revise o texto antes de publicar.**

          ## Baixar
          - **Windows:** \`skyship_${VERSION}_x64-setup.exe\` (instalador). O pacote \`...-portable.zip\` traz \`skyship.exe\` (terminal) e \`skyship-gui.exe\` para rodar sem instalar.
          - **Linux:** \`skyship_${VERSION}_amd64.AppImage\` (torne executável e execute) ou \`skyship_${VERSION}_amd64.deb\`.
          - Você precisa do [Docker](https://docs.docker.com/get-docker/) instalado e rodando.

          ## Windows: aviso de segurança
          Este instalador ainda **não é assinado**. O Windows pode mostrar "O Windows protegeu o seu computador". Clique em **Mais informações → Executar assim mesmo**.

          ## Conferir o download
          \`\`\`
          sha256sum -c SHA256SUMS
          gh attestation verify <arquivo> --repo ${GITHUB_REPOSITORY}
          \`\`\`

          ## O que já foi testado numa conta de verdade
          Veja a tabela "O que funciona hoje" do README. Este é um pré-lançamento.
          EOF
      - name: Criar o rascunho
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flag=""
          if [ "${PRERELEASE}" = "true" ]; then flag="--prerelease"; fi
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --draft ${flag} --verify-tag \
            --title "skyship ${TAG}" \
            --notes-file notes.md
