name: Auditoria de dependências

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/*/Cargo.toml
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # segundas, 06:17 UTC: novos avisos aparecem sem mudar o código
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@893d6ee8d714b6c7dfe2bcd94e5759e9a7958a7e # v2.90.10
        with:
          tool: cargo-audit
      # Falha com vulnerabilidades. Avisos informativos (crates sem manutenção, "unsound") não
      # derrubam: os do Tauri/GTK estão descritos em docs/security.md.
      - name: Auditar
        run: cargo audit
