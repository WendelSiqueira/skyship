[package]
name = "skyship-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Interface gráfica (Tauri) do skyship"

[build-dependencies]
tauri-build = "2.7.6"

[dependencies]
anyhow = "1.0.105"
skyship-core = { path = "../core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
getrandom = "0.3.4"
tauri = "2.12.7"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-opener = "2.7.3"
zeroize = "1.9.2"
