[package]
name = "skyship-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Lógica de deploy do skyship (sem interface): usada pelo CLI e pela GUI"

[dependencies]
anyhow = "1.0.105"
aws-config = { version = "1.13.4", features = ["behavior-version-latest"] }
aws-credential-types = "1.3.1"
# default-features = false: o default dos aws-sdk-* liga a feature `rustls` (cliente HTTP legado,
# hyper 0.14 + rustls 0.21 + h2 0.3, com avisos no cargo audit). `default-https-client` já traz
# o cliente atual (hyper 1 + rustls 0.23).
aws-sdk-ec2 = { version = "1.284.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ecr = { version = "1.143.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-iam = { version = "1.140.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-lightsail = { version = "1.141.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-ssm = { version = "1.140.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1.129.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.23.1"
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
dunce = "1.0.5"
tokio = { version = "1.54.1", features = ["rt", "process", "fs", "time", "io-util", "net"] }
toml = "1.2.3"
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }
