[workspace]
members = ["crates/core", "crates/cli", "crates/gui"]
# crates/gui fica fora do `cargo build` e `cargo test` padrão porque o Tauri e o WebKit demoram para
# compilar; use `cargo build -p skyship-gui` (veja docs/development.md)
default-members = ["crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[profile.dev]
debug = 0
